<VirtualHost *:${PORT}>
	DocumentRoot /var/www/magento/pub
	<Directory /var/www/magento/pub>
		Options FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>
	# Railway's edge connects from 100.64.0.0/10 and sets X-Real-IP to the visitor.
	RemoteIPHeader X-Real-IP
	RemoteIPInternalProxy 100.64.0.0/10
</VirtualHost>
